name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  COV_MIN: "0"  # поднять до 70, когда модули других участников будут готовы

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy pytest
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          activate-environment: stepdiff
      - name: Установка зависимостей
        shell: bash -el {0}
        run: |
          if [ -f environment.yml ]; then
            conda env update -n stepdiff -f environment.yml
          else
            conda install -y pythonocc-core matplotlib
          fi
          conda install -y pytest pytest-cov
          if [ -f pyproject.toml ]; then pip install -e .; fi
      - name: Тесты и покрытие
        shell: bash -el {0}
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=${COV_MIN}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
